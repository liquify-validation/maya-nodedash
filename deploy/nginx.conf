# Classic Maya dashboard, served from the site root (as the original Maya dashboard was).
# Include inside the `server { ... }` block for the Maya dashboard's domain.
# `npm run build` output (dist/) is copied to /var/www/maya-classic.

root /var/www/maya-classic;

# Fingerprinted build assets never change: cache them for a year.
location /assets/ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# Everything else is the single-page app (client-side routes fall back to index.html).
location / {
    try_files $uri $uri/ /index.html;

    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://maya-api.liquify.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
}
